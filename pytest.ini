[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
asyncio_mode = auto
markers =
    unit: Pure unit tests (no external dependencies)
    integration: Integration tests (require running services)
    slow: Slow tests (>5s)
addopts = -v --tb=short -m "not integration and not slow"
