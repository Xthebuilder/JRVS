# ─────────────────────────────────────────────────────────────────────────────
# JRVS Autonomous Agent — Goals File
# /home/xavier/JRVS/goals.yaml
#
# Each goal has:
#   id          – unique slug used in DB and CLI references
#   goal        – plain-English description of what the agent should do
#   schedules   – list of: morning / hourly / daily / weekly / manual
#   tier        – strictest security tier allowed for this goal:
#                   auto    → silent read-only ops only
#                   notify  → reads + creates docs/sheets/events; digest email sent
#                   confirm → anything requiring sends/deletes; waits for your approval
#   enabled     – set false to disable without deleting
# ─────────────────────────────────────────────────────────────────────────────

goals:

  - id: morning_digest
    goal: >
      Check my Gmail inbox for unread emails received overnight.
      Summarise the key topics, senders, and any action items.
      Create a Google Doc titled "Morning Digest – {date}" with the full summary.
    schedules:
      - morning
    tier: notify
    enabled: true

  - id: weekly_youtube_report
    goal: >
      Analyse the YouTube channels I track for the past 7 days:
      top performing videos, growth trend, outlier detections, and engagement score.
      Write a Google Doc titled "Weekly YouTube Report – {date}" with the findings.
      Then email me the summary as a digest.
    schedules:
      - weekly
    tier: notify
    enabled: true

  - id: urgent_email_watch
    goal: >
      Search Gmail for emails marked urgent, flagged, or containing words like
      "urgent", "ASAP", "deadline", "action required" received in the last hour.
      For each one, draft a courteous acknowledgement reply and queue it for my approval.
    schedules:
      - hourly
    tier: confirm
    enabled: true

  - id: weekly_trend_research
    goal: >
      Search the web and YouTube for the top trending topics in my niche
      (YouTube growth, AI tools, content strategy).
      Append a weekly trends section to my running "Research Notes" Google Doc,
      or create it if it does not exist yet.
    schedules:
      - weekly
    tier: notify
    enabled: true

# ─────────────────────────────────────────────────────────────────────────────
